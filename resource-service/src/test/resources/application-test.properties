spring.cloud.config.import-check.enabled=false
spring.application.name=resource-service
#spring.profiles.active=test
server.port=0
spring.main.allow-bean-definition-overriding=true
eureka.client.enabled=false

# Mock or stub these services in your tests
storage-service.endpoint=http://mock-storage-service

# Use an in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# AWS configuration
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
cloud.aws.region.static=us-east-1
cloud.aws.s3.staging-bucket-name=staging-bucket-name
cloud.aws.s3.permanent-bucket-name=permanent-bucket-name
cloud.aws.s3.stub-staging-bucket-name=stub-staging-bucket
cloud.aws.s3.stub-permanent-bucket-name=stub-permanent-bucket
cloud.aws.s3.endpoint=http://localhost:4566

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=test
spring.rabbitmq.password=test
resource.rabbitmq.exchange=test-exchange
resource.rabbitmq.queue=test-queue
resource.ack.queue=resource-ack-queue
resource.process.queue=resource-process-queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.codec.max-in-memory-size=52428800
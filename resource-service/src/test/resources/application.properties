# DataSource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/resource_db
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword

# Eureka configuration
eureka.client.enabled=false

# Hibernate properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AWS configuration
cloud.aws.credentials.access-key=accesskey
cloud.aws.credentials.secret-key=secretkey
cloud.aws.region.static=us-east-1
cloud.aws.s3.bucket-name=bucket-name
cloud.aws.s3.endpoint=http://localstack:4566
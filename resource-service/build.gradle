plugins {
	id 'java'
	id 'org.springframework.cloud.contract' version '4.1.3'
}

tasks.bootJar {
	enabled = true
	mainClass = 'com.krystseu.microservices.resourceservice.ResourceServiceApplication'
}


dependencies {
	implementation 'org.apache.tika:tika-core:2.9.2'
	implementation 'org.apache.tika:tika-parser-audiovideo-module:2.9.2'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.744'
	implementation 'cloud.localstack:localstack-utils:0.2.22'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.retry:spring-retry:1.3.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:testcontainers-bom:1.19.7'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:localstack'

	// Cucumber dependencies
	testImplementation 'io.cucumber:cucumber-java:7.1.0'
	testImplementation 'io.cucumber:cucumber-junit:7.1.0'
	testImplementation 'io.cucumber:cucumber-spring:7.1.0'
	testImplementation 'com.h2database:h2'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.1.0'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
	testImplementation 'io.rest-assured:spring-mock-mvc:5.5.0'

	implementation project(':song-service')
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

contracts {
	baseClassForTests = 'com.krystseu.microservices.resourceservice.contract.ContractHttpVerifierBase'
	failOnNoContracts = false
}
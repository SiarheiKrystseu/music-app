spring.cloud.config.import-check.enabled=false
spring.application.name=resource-processor
server.port=0
spring.main.allow-bean-definition-overriding=true
spring.codec.max-in-memory-size=52428800

# Mock or stub these services in your tests
resource-service.endpoint=http://mock-resource-service
song-service.endpoint=http://mock-song-service

# Disable Eureka client
eureka.client.service-url.defaultZone=http://mock-eureka-server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Use RabbitMQ from Testcontainers
spring.rabbitmq.host=localhost
spring.rabbitmq.amqp-port=5672
spring.rabbitmq.management-port=15672
spring.rabbitmq.username=test
spring.rabbitmq.password=test
resource.rabbitmq.exchange=resource-exchange
resource.rabbitmq.queue=resource-queue
resource.ack.queue=resource-ack-queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.enabled-by-default=false

# Logging configuration
logging.level.root=INFO
logging.level.org.springframework=INFO

firebase.service.account.path=../resources/music-app-firebase-adminsdk.json
